<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Camera Body -->
  <g filter="url(#glow)">
    <!-- Top viewfinder hump -->
    <path d="M 216 140 L 296 140 L 316 170 L 196 170 Z" fill="#334155"/>
    
    <!-- Camera Main Body -->
    <rect x="110" y="170" width="292" height="190" rx="36" fill="#1e293b" stroke="#475569" stroke-width="6"/>
    <rect x="126" y="186" width="260" height="158" rx="24" fill="#0f172a"/>
    
    <!-- Flash element -->
    <circle cx="160" cy="216" r="14" fill="#facc15"/>
    <circle cx="160" cy="216" r="8" fill="#ffffff"/>

    <!-- Lens Outer Ring -->
    <circle cx="256" cy="265" r="76" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
    <circle cx="256" cy="265" r="62" fill="url(#lensGrad)"/>
    <circle cx="256" cy="265" r="46" fill="#0c4a6e"/>
    <circle cx="256" cy="265" r="26" fill="#082f49"/>

    <!-- Lens Reflection -->
    <path d="M 230 235 A 40 40 0 0 1 270 235" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Timestamp Clock Badge (Bottom Right) -->
  <g filter="url(#glow)">
    <circle cx="370" cy="370" r="70" fill="#000000" stroke="#ffffff" stroke-width="6"/>
    <!-- Clock ticks -->
    <line x1="370" y1="312" x2="370" y2="322" stroke="#ffffff" stroke-width="4"/>
    <line x1="370" y1="418" x2="370" y2="428" stroke="#ffffff" stroke-width="4"/>
    <line x1="312" y1="370" x2="322" y2="370" stroke="#ffffff" stroke-width="4"/>
    <line x1="418" y1="370" x2="428" y2="370" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Clock hands -->
    <line x1="370" y1="370" x2="370" y2="335" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="370" y1="370" x2="395" y2="370" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <!-- Red second hand -->
    <line x1="370" y1="378" x2="350" y2="395" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="370" cy="370" r="5" fill="#ef4444"/>
  </g>
</svg>
